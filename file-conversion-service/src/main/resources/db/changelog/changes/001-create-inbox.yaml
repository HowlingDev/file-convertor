databaseChangeLog:
  - changeSet:
      id: 1-create-inbox
      author: grigoriy
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false