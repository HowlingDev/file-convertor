server:
  error:
    include-message: always
  port: 0

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:demobucket}

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
    org.springframework.kafka.transaction: TRACE
    org.springframework.transaction: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: file-conversion-service
  kafka:
    topics:
      convert-event: convert-to-pdf-topic
      success-event: successful-file-conversion-topic
      failed-event: failed-file-conversion-topic
    admin:
      auto-create: false
    consumer:
      bootstrap-servers: localhost:9092, localhost:9094, localhost:9096
      group-id: file-to-pdf
      enable-auto-commit: true
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.events
    producer:
      bootstrap-servers: localhost:9092, localhost:9094, localhost:9096
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      enable:
        idempotence: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml