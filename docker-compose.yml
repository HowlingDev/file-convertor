##version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.4.0
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9094,kafka-3:9096
      - KAFKA_CLUSTERS_0_NAME=kraft
  kafka-1:
    image: apache/kafka:4.2.0
    container_name: kafka-1
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9091:9091"
      - "9090:9090"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "fa995b8a-0b05-4572-b30a-dc934fc157ac"
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      KAFKA_LISTENERS: "PLAINTEXT://:9090, CONTROLLER://:9091, PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9090, PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT, PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - C:/Users/user/Desktop/kafka-volumes/kafka-1:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-2:
    image: apache/kafka:4.2.0
    container_name: kafka-2
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 2
      CLUSTER_ID: "fa995b8a-0b05-4572-b30a-dc934fc157ac"
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      KAFKA_LISTENERS: "PLAINTEXT://:9090, CONTROLLER://:9091, PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9090, PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT, PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - C:/Users/user/Desktop/kafka-volumes/kafka-2:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-3:
    image: apache/kafka:4.2.0
    container_name: kafka-3
    restart: unless-stopped
    ports:
      - "9096:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 3
      CLUSTER_ID: "fa995b8a-0b05-4572-b30a-dc934fc157ac"
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      KAFKA_LISTENERS: "PLAINTEXT://:9090, CONTROLLER://:9091, PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9090, PLAINTEXT_HOST://localhost:9096"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT, PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - C:/Users/user/Desktop/kafka-volumes/kafka-3:/var/lib/kafka/data
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge